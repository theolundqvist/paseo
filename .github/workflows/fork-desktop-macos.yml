name: Fork Desktop macOS

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build."
        required: true
        default: main
        type: string

concurrency:
  group: fork-desktop-macos-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos-arm64:
    if: github.repository != 'getpaseo/paseo'
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build desktop app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          EP_GH_IGNORE_TIME: true
          PASEO_DESKTOP_SMOKE: "1"
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
          NODE_OPTIONS: --max-old-space-size=4096
        # Without signing credentials electron-builder ad-hoc signs arm64. The publish
        # override points the bundled app-update.yml at this fork so the app never
        # downloads an upstream getpaseo release. dist/fork-release.json switches the
        # packaged app to the fork updater, which installs newer fork releases itself.
        run: |
          set -euo pipefail
          mkdir -p packages/desktop/dist
          printf '{"repository":"%s","tag":"fork-%s"}\n' "${{ github.repository }}" "$(git rev-parse --short=7 HEAD)" \
            > packages/desktop/dist/fork-release.json
          npm run build:desktop -- --publish never --mac --arm64 \
            -c.mac.notarize=false \
            -c.mac.hardenedRuntime=false \
            "-c.publish.owner=${{ github.repository_owner }}" \
            "-c.publish.repo=${{ github.event.repository.name }}"

      - name: Verify updater feed
        shell: bash
        run: |
          set -euo pipefail
          app_update="packages/desktop/release/mac-arm64/Paseo.app/Contents/Resources/app-update.yml"
          cat "$app_update"
          grep -Fxq "owner: ${{ github.repository_owner }}" "$app_update"
          grep -Fxq "repo: ${{ github.event.repository.name }}" "$app_update"
          node -e '
            const stamp = JSON.parse(require("@electron/asar").extractFile(process.argv[1], "dist/fork-release.json"));
            if (stamp.tag !== process.argv[2]) throw new Error(`stamped ${stamp.tag}`);
          ' packages/desktop/release/mac-arm64/Paseo.app/Contents/Resources/app.asar "fork-$(git rev-parse --short=7 HEAD)"

      - name: Upload packaged smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-desktop-smoke-macos-arm64
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

      # Only installers are published, never a *-mac.yml manifest: the fork updater
      # reads the zip and its digest from the releases API instead.
      - name: Publish fork prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tag="fork-$(git rev-parse --short=7 HEAD)"
          shopt -s nullglob
          assets=(packages/desktop/release/*.dmg packages/desktop/release/*.zip)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No .dmg or .zip artifacts in packages/desktop/release"
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$sha" \
              --prerelease \
              --title "Paseo fork $tag" \
              --notes "Unsigned Apple Silicon build of \`$SOURCE_REF\` at $sha. On first install, run \`xattr -dr com.apple.quarantine /Applications/Paseo.app\`; later releases install themselves through Settings → Updates."
          fi
          echo "Published https://github.com/$GH_REPO/releases/tag/$tag"
